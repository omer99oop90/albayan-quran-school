name: Build & Release Albayan Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave blank for automatic v3.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build AlbayanApp APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android project (preserving webDir)
        run: |
          rm -rf /tmp/cap_web_src
          cp -r android/app/src/main/assets/public /tmp/cap_web_src
          cp capacitor.config.json /tmp/orig_capacitor.config.json
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); c.webDir='/tmp/cap_web_src'; fs.writeFileSync('capacitor.config.json', JSON.stringify(c,null,2));"
          npx cap sync android
          cp /tmp/orig_capacitor.config.json capacitor.config.json
          cp /tmp/orig_capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Determine Release tag & Android version
        id: meta
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v3.0.${{ github.run_number }}"
          fi
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode persistent Android release keystore
        env:
          ALBAYAN_KEYSTORE_B64: ${{ secrets.ALBAYAN_KEYSTORE_B64 }}
        run: |
          if [ -z "$ALBAYAN_KEYSTORE_B64" ]; then
            echo "ERROR: ALBAYAN_KEYSTORE_B64 secret is missing!"
            exit 1
          fi
          printf '%s' "$ALBAYAN_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/albayan-release.jks"
          ls -lh "${{ runner.temp }}/albayan-release.jks"

      - name: Build signed Release Android APK via Gradle
        env:
          ALBAYAN_KEYSTORE_FILE: ${{ runner.temp }}/albayan-release.jks
          ALBAYAN_KEYSTORE_PASSWORD: ${{ secrets.ALBAYAN_KEYSTORE_PASSWORD }}
          ALBAYAN_KEY_ALIAS: ${{ secrets.ALBAYAN_KEY_ALIAS }}
          ALBAYAN_KEY_PASSWORD: ${{ secrets.ALBAYAN_KEY_PASSWORD }}
          ALBAYAN_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ALBAYAN_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare & verify APK artifact
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/AlbayanApp.apk
          rm -f "${{ runner.temp }}/albayan-release.jks"
          ls -lh release-assets/AlbayanApp.apk
          keytool -printcert -jarfile release-assets/AlbayanApp.apk | grep -E "Owner|SHA256"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlbayanApp-apk
          path: release-assets/AlbayanApp.apk

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "مدرسة البيان - التحديث ${{ steps.meta.outputs.tag }}"
          body: |
            ### تحديث تطبيق مدرسة البيان (`AlbayanApp.apk`)
            - رقم الإصدار: `${{ steps.meta.outputs.version_name }}` (`versionCode: ${{ steps.meta.outputs.version_code }}`)
            - التوقيع: موقّع بشهادة التوقيع الثابتة للتطبيق لدعم التحديث المباشر فوق النسخ المثبّتة بنفس الشهادة.

            **للتثبيت على الجوال:** قم بتنزيل ملف `AlbayanApp.apk` من المرفقات أدناه وافتحه للتثبيت أو التحديث.
          files: |
            release-assets/AlbayanApp.apk
          draft: false
          prerelease: false
