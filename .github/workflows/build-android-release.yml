name: Build & Release Albayan Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave blank for automatic v3.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build AlbayanApp APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android project (preserving webDir)
        run: |
          rm -rf /tmp/cap_web_src
          cp -r android/app/src/main/assets/public /tmp/cap_web_src
          cp capacitor.config.json /tmp/orig_capacitor.config.json
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); c.webDir='/tmp/cap_web_src'; fs.writeFileSync('capacitor.config.json', JSON.stringify(c,null,2));"
          npx cap sync android
          cp /tmp/orig_capacitor.config.json capacitor.config.json
          cp /tmp/orig_capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare APK artifact
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/AlbayanApp.apk
          ls -lh release-assets/AlbayanApp.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlbayanApp-apk
          path: release-assets/AlbayanApp.apk

      - name: Determine Release tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v3.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "مدرسة البيان - التحديث ${{ steps.meta.outputs.tag }}"
          body: |
            ### تحديث تطبيق مدرسة البيان (`AlbayanApp.apk`)
            - تحديث **استوديو الشهادات الاحترافية** (`certificates.html` / `certificates.js` / `certificates.css`):
              - إصلاح التراجع والإعادة (`Undo` / `Redo`) وحفظ المسودة والقوالب الجاهزة تلقائياً.
              - قوالب وزخارف افتراضية واضحة وإدارة كاملة للطبقات والشفافية والدوران والخط لكل عنصر.
              - جلب الطلاب والحلقات ومعايير المتفوقين من Firebase والعمل دون إنترنت مع بحث مباشر.
              - دعم التصدير الفردي (PNG / PDF) والجماعي (ZIP / PDF مجمع) مع شريط تقدم وإلغاء، والطباعة المباشرة والمشاركة في أندرويد.

            **للتثبيت على الجوال:** قم بتنزيل ملف `AlbayanApp.apk` من المرفقات أدناه وافتحه للتثبيت.
          files: |
            release-assets/AlbayanApp.apk
          draft: false
          prerelease: false
