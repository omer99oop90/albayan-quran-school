<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <title>بيان الطالب - مدرسة البيان لتعليم القرآن</title>
  <script>
    (function() {
      try {
        var userStr = localStorage.getItem("albayan_logged_user");
        if (userStr) {
          var user = JSON.parse(userStr);
          if (user && (user.username || user.student_name)) {
            if (user.role === 'student') {
              window.location.replace("mymark.html");
            } else {
              window.location.replace("circles.html");
            }
            return;
          }
        }
      } catch(e) {}
      window.location.replace("login.html");
    })();
  </script>
</head>
<body style="background:#064e3b; margin:0; padding:0;"></body>
</html>
