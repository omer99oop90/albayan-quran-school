<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="">
  <title>تسجيل الدخول - مدرسة البيان لتعليم القرآن</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark_theme.css?v=1.0">
  <script src="lucide.min.js"></script>
  <script>if(typeof lucide==='undefined'){document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');}</script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    :root {
      --login-card-bg: #FFFFFF;
      --login-card-border: #E2E8F0;
      --login-text: #0F172A;
      --login-muted: #64748B;
      --login-input-bg: #F8FAFC;
      --login-primary: #2563EB;
      --login-primary-hover: #1D4ED8;
    }

    html[data-theme="dark"] {
      --login-card-bg: #1E293B;
      --login-card-border: rgba(255, 255, 255, 0.1);
      --login-text: #F8FAFC;
      --login-muted: #94A3B8;
      --login-input-bg: #0F172A;
      --login-primary: #2563EB;
      --login-primary-hover: #1D4ED8;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-box {
      background: var(--login-card-bg);
      border: 1px solid var(--login-card-border);
      border-radius: 24px;
      padding: 32px 26px;
      width: 100%;
      max-width: 440px;
      box-shadow: none !important;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    .login-box h1 {
      margin: 0;
      font-size: 21px;
      color: var(--login-text);
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .login-box p {
      margin: 4px 0 0;
      font-size: 13.5px;
      color: var(--login-muted);
      line-height: 1.5;
    }

    /* Staff Role Switcher (معلم / مشرف) */
    .login-tabs-wrap {
      display: flex;
      background: var(--login-input-bg);
      padding: 4px;
      border-radius: 14px;
      gap: 6px;
      border: 1px solid var(--login-card-border);
    }

    .login-tab-btn {
      flex: 1;
      height: 42px;
      min-height: 42px !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px !important;
      border-radius: 10px !important;
      border: 1px solid transparent !important;
      background: transparent !important;
      background-image: none !important;
      color: var(--login-muted) !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: none !important;
      transition: background-color 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }

    .login-tab-btn svg,
    .login-tab-btn .lucide {
      margin: 0 !important;
      display: block;
    }

    .login-tab-btn:hover {
      transform: none !important;
      background: transparent !important;
    }

    .login-tab-btn.active {
      background: #FFFFFF !important;
      color: #2563EB !important;
      border-color: rgba(37, 99, 235, 0.25) !important;
    }

    html[data-theme="dark"] .login-tab-btn.active {
      background: #1E293B !important;
      color: #60A5FA !important;
      border-color: rgba(96, 165, 250, 0.35) !important;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: right;
    }

    .field label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--login-text);
      margin-bottom: 7px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon input {
      width: 100%;
      height: 50px;
      padding: 0 16px 0 44px;
      border-radius: 12px;
      border: 1px solid var(--login-card-border);
      background: var(--login-input-bg);
      color: var(--login-text);
      font-size: 15px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.18s ease, background-color 0.18s ease;
    }

    .input-with-icon input:focus {
      border-color: #2563EB;
      background: #FFFFFF;
    }

    html[data-theme="dark"] .input-with-icon input:focus {
      background: #0F172A;
    }

    .input-with-icon .field-icon {
      position: absolute;
      left: 14px;
      color: var(--login-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit-main {
      height: 50px;
      min-height: 50px !important;
      padding: 0 20px !important;
      font-size: 15px;
      width: 100%;
      background: #2563EB !important;
      background-image: none !important;
      color: #FFFFFF !important;
      border: none !important;
      border-radius: 14px !important;
      cursor: pointer;
      font-weight: 800;
      display: flex !important;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: none !important;
      font-family: inherit;
      margin-top: 4px;
      transition: background-color 0.16s ease, transform 0.14s ease;
    }

    .btn-submit-main:hover {
      background: #1D4ED8 !important;
      transform: none !important;
    }

    .btn-submit-main:active {
      transform: scale(0.985) !important;
    }

    .btn-submit-main svg,
    .btn-submit-main .lucide {
      margin: 0 !important;
      display: block;
    }

    .alert-box {
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.5;
    }

    .alert-box.err {
      background: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FECACA;
    }

    html[data-theme="dark"] .alert-box.err {
      background: rgba(220, 38, 38, 0.15);
      color: #F87171;
      border-color: rgba(248, 113, 113, 0.3);
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo" style="display:flex; justify-content:center; align-items:center;">
        <img src="logo.png" alt="شعار مدرسة البيان"
          style="max-width:140px; width:100%; height:auto; object-fit:contain; filter:none;">
      </div>

      <div>
        <h1>مدرسة البيان لتعليم القرآن</h1>
        <p>بوابة الدخول للمعلمين والمشرفين</p>
      </div>

      <!-- Staff Role Switcher Only -->
      <div class="login-tabs-wrap" role="tablist" aria-label="اختر الدور الوظيفي">
        <button type="button" class="login-tab-btn active" id="tabTeacherBtn" onclick="selectStaffRole('teacher')">
          <i data-lucide="book-open" style="width:17px; height:17px;"></i>
          <span>معلم</span>
        </button>
        <button type="button" class="login-tab-btn" id="tabSupervisorBtn" onclick="selectStaffRole('supervisor')">
          <i data-lucide="shield-check" style="width:17px; height:17px;"></i>
          <span>مشرف</span>
        </button>
      </div>

      <div id="loginAlert" class="alert-box err" style="display:none; text-align:right;"></div>

      <form class="login-form" id="staffLoginForm" onsubmit="handleStaffSubmit(event)">
        <div class="field">
          <label for="staffUsernameInput">اسم المستخدم</label>
          <div class="input-with-icon">
            <input type="text" id="staffUsernameInput" placeholder="أدخل اسم المستخدم" required autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false">
            <span class="field-icon"><i data-lucide="user" style="width:18px; height:18px;"></i></span>
          </div>
        </div>

        <div class="field">
          <label for="staffCodeInput">رمز المرور</label>
          <div class="input-with-icon">
            <input type="password" id="staffCodeInput" placeholder="أدخل رمز المرور" required autocomplete="current-password" autocorrect="off" autocapitalize="none" spellcheck="false">
            <span class="field-icon"><i data-lucide="lock" style="width:18px; height:18px;"></i></span>
          </div>
        </div>

        <button type="submit" id="staffLoginBtn" class="btn-submit-main">
          <span>تسجيل الدخول</span>
          <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    let selectedStaffRole = "teacher";
    const FB_BASE = "https://bayan-56e77-default-rtdb.asia-southeast1.firebasedatabase.app";

    function normalizeArabicName(name) {
      if (!name) return "";
      let s = String(name).trim();
      s = s.replace(/[\u064B-\u065F\u0670\u0640]/g, "");
      s = s.replace(/[أإآٱ]/g, "ا");
      s = s.replace(/[ةه]/g, "ه");
      s = s.replace(/[ىي]/g, "ي");
      s = s.replace(/[ؤ]/g, "و");
      s = s.replace(/[ئ]/g, "ي");
      s = s.replace(/\bعبد\s+/g, "عبد");
      s = s.replace(/\bال\s+/g, "ال");
      return s.split(/\s+/).join(" ").toLowerCase();
    }

    function selectStaffRole(role) {
      selectedStaffRole = (role === "supervisor") ? "supervisor" : "teacher";
      const teacherBtn = document.getElementById("tabTeacherBtn");
      const supBtn = document.getElementById("tabSupervisorBtn");
      const alertBox = document.getElementById("loginAlert");

      if (alertBox) alertBox.style.display = "none";
      if (teacherBtn) teacherBtn.classList.toggle("active", selectedStaffRole === "teacher");
      if (supBtn) supBtn.classList.toggle("active", selectedStaffRole === "supervisor");
      try { localStorage.setItem("albayan_last_staff_role", selectedStaffRole); } catch (e) {}
    }

    async function handleStaffSubmit(e) {
      e.preventDefault();
      const usernameInput = document.getElementById("staffUsernameInput");
      const codeInput = document.getElementById("staffCodeInput");
      const alertBox = document.getElementById("loginAlert");
      const btn = document.getElementById("staffLoginBtn");

      const username = (usernameInput.value || "").trim();
      const code = (codeInput.value || "").trim();

      alertBox.style.display = "none";
      if (!username || !code) return;

      btn.disabled = true;
      btn.innerHTML = `<span>جاري التحقق...</span>`;

      const normUser = normalizeArabicName(username);

      function isDeletedUser(u) {
        return Boolean(!u || typeof u !== "object" || u.deleted || u.is_deleted === 1 || u.is_deleted === "1" || u.is_deleted === true);
      }

      function findMatchingStaff(list) {
        if (!Array.isArray(list)) return null;
        let exactMatch = null;
        let normMatch = null;
        for (const u of list) {
          if (isDeletedUser(u)) continue;
          const candidates = [u.username, u.display_name, u.name]
            .map(v => String(v || "").trim())
            .filter(Boolean);
          if (candidates.some(c => c.toLowerCase() === username.toLowerCase())) {
            exactMatch = u;
            break;
          }
          if (!normMatch && candidates.some(c => normalizeArabicName(c) === normUser)) {
            normMatch = u;
          }
        }
        return exactMatch || normMatch;
      }

      function normalizeStaffId(rawId, fallbackKey = null) {
        const val = (rawId !== undefined && rawId !== null && String(rawId).trim() !== "") ? rawId : fallbackKey;
        if (val === null || val === undefined) return null;
        const clean = String(val).replace(/^users_/i, "").trim();
        if (!clean) return null;
        const num = Number(clean);
        return (!Number.isNaN(num) && String(num) === clean) ? num : clean;
      }

      let matchedStaff = null;
      let fbUsersList = [];
      let fbFetched = false;
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3200);
        const res = await fetch(`${FB_BASE}/users.json`, { signal: controller.signal, cache: "no-store" });
        clearTimeout(timeoutId);
        if (res.ok) {
          fbFetched = true;
          const raw = await res.json();
          if (raw && typeof raw === "object") {
            const entries = Array.isArray(raw)
              ? raw.map((u, idx) => [String(idx), u])
              : Object.entries(raw);
            const dedup = new Map();
            for (const [k, u] of entries) {
              if (isDeletedUser(u)) continue;
              const uid = normalizeStaffId(u.id !== undefined ? u.id : u.local_id, k);
              const normalized = { ...u, id: uid, local_id: uid };
              const mapKey = uid !== null ? String(uid) : String(k);
              const existing = dedup.get(mapKey);
              if (!existing || String(k) === String(uid)) {
                dedup.set(mapKey, normalized);
              }
            }
            fbUsersList = Array.from(dedup.values());
            try {
              if (fbUsersList.length > 0) {
                localStorage.setItem("cached_users_list", JSON.stringify(fbUsersList));
              }
            } catch (e) {}
            matchedStaff = findMatchingStaff(fbUsersList);
          }
        }
      } catch (err) {}

      // Offline fallback: check locally cached staff accounts before any server/bootstrap fallback
      let localUsersLoaded = false;
      if (!matchedStaff && !fbFetched) {
        try {
          const cachedRaw = localStorage.getItem("cached_users_list");
          if (cachedRaw) {
            const cachedList = JSON.parse(cachedRaw);
            if (Array.isArray(cachedList) && cachedList.length > 0) {
              localUsersLoaded = true;
              matchedStaff = findMatchingStaff(cachedList);
            }
          }
        } catch (e) {}
      }

      if (matchedStaff) {
        if (matchedStaff.role === "student") {
          showLoginError("هذا الحساب مخصص لبوابة الطلاب ولا يمكن تسجيل الدخول به هنا.");
          return;
        }
        if (matchedStaff.is_active === 0 || matchedStaff.is_active === "0" || matchedStaff.is_active === false) {
          showLoginError("هذا الحساب معطّل من قبل إدارة المدرسة. يرجى التواصل مع المسؤول.");
          return;
        }
        const rawStoredCode = (matchedStaff.passcode !== undefined && matchedStaff.passcode !== null && String(matchedStaff.passcode).trim() !== "")
          ? String(matchedStaff.passcode).trim()
          : (matchedStaff.code !== undefined && matchedStaff.code !== null && String(matchedStaff.code).trim() !== "" ? String(matchedStaff.code).trim() : "123456");
        if (code !== rawStoredCode) {
          showLoginError("اسم المستخدم أو رمز المرور غير صحيح.");
          return;
        }
        const resolvedRole = (matchedStaff.role === "admin" || matchedStaff.role === "supervisor" || matchedStaff.role === "teacher")
          ? matchedStaff.role
          : (matchedStaff.is_superadmin ? "admin" : selectedStaffRole);
        saveSessionAndRedirect(
          matchedStaff.username || matchedStaff.display_name || username,
          resolvedRole,
          matchedStaff.display_name || matchedStaff.username || username,
          "staff_token_" + Date.now(),
          {
            id: normalizeStaffId(matchedStaff.id, matchedStaff.local_id),
            is_superadmin: (matchedStaff.is_superadmin === 1 || matchedStaff.is_superadmin === "1" || matchedStaff.is_superadmin === true) ? 1 : 0,
            permissions: matchedStaff.permissions
          }
        );
        return;
      }

      // Check local server auth endpoint when reachable
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1600);
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, code, role: selectedStaffRole }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          if (data && data.success && data.role !== "student") {
            saveSessionAndRedirect(
              data.username || username,
              data.role || selectedStaffRole,
              data.display_name || username,
              "staff_token_" + Date.now(),
              {
                id: normalizeStaffId(data.id),
                is_superadmin: data.is_superadmin ? 1 : 0,
                permissions: data.permissions
              }
            );
            return;
          }
        }
      } catch (err) {}

      // Bootstrap admin only when no staff database exists yet (first-run setup)
      const hasAnyKnownUsers = (fbFetched && fbUsersList.length > 0) || localUsersLoaded;
      const isBootstrapAdmin = (normUser === "admin" || normUser === "مدير" || username.toLowerCase() === "admin");
      if (!hasAnyKnownUsers && isBootstrapAdmin && code === "123456") {
        saveSessionAndRedirect(
          username,
          "admin",
          username,
          "staff_token_" + Date.now(),
          {
            is_superadmin: 1,
            permissions: ["circles", "all_circles", "exams", "analytics", "student_cv", "users"]
          }
        );
        return;
      }

      showLoginError("اسم المستخدم أو رمز المرور غير صحيح.");
    }

    function showLoginError(message) {
      const alertBox = document.getElementById("loginAlert");
      const btn = document.getElementById("staffLoginBtn");
      if (alertBox) {
        alertBox.textContent = message;
        alertBox.style.display = "block";
      }
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<span>تسجيل الدخول</span><i data-lucide="arrow-left" style="width:18px; height:18px;"></i>`;
      }
      if (window.lucide) lucide.createIcons();
    }

    function parseLoginPermissions(rawPerms, staffRole, isSuper) {
      if (isSuper) {
        return ["circles", "all_circles", "exams", "analytics", "student_cv", "users"];
      }
      if (Array.isArray(rawPerms)) return rawPerms.map(String);
      if (typeof rawPerms === "string" && rawPerms.trim()) {
        try {
          const parsed = JSON.parse(rawPerms);
          if (Array.isArray(parsed)) return parsed.map(String);
        } catch (e) {
          return rawPerms.split(",").map(s => s.trim()).filter(Boolean);
        }
      }
      if (staffRole === "admin") {
        return ["circles", "all_circles", "exams", "analytics", "student_cv", "users"];
      }
      if (staffRole === "supervisor") {
        return ["circles", "all_circles", "exams", "analytics", "student_cv"];
      }
      return ["circles", "exams", "analytics", "student_cv"];
    }

    function resolveLandingPage(staffRole, isSuper, perms) {
      if (isSuper || staffRole === "admin") return "circles.html";
      const list = Array.isArray(perms) ? perms : [];
      if (list.includes("circles")) return "circles.html";
      if (list.includes("exams")) return "admin.html";
      if (list.includes("analytics")) return "analytics.html";
      if (list.includes("student_cv")) return "student_cv.html";
      if (list.includes("users")) return "users.html";
      return "more.html";
    }

    function saveSessionAndRedirect(username, role, name, token, extra = {}) {
      const staffRole = (role === "admin" || role === "supervisor" || role === "teacher")
        ? role
        : selectedStaffRole;
      const isSuper = extra.is_superadmin === 1 ? 1 : 0;
      const resolvedPermissions = parseLoginPermissions(extra.permissions, staffRole, isSuper === 1);

      try {
        localStorage.setItem("albayan_logged_user", JSON.stringify({
          logged_in: true,
          id: extra.id ?? null,
          username: username,
          role: staffRole,
          display_name: name || username,
          is_superadmin: isSuper,
          permissions: resolvedPermissions
        }));
        localStorage.setItem("albayan_saved_username", username);
        localStorage.setItem("albayan_saved_token", token || ("staff_token_" + Date.now()));
        localStorage.removeItem("albayan_active_circle_id");
        sessionStorage.removeItem("albayan_me_cache");
        sessionStorage.removeItem("albayan_teacher_circle_nav");
        sessionStorage.removeItem("albayan_teacher_single_circle");
      } catch (e) {}

      window.location.href = resolveLandingPage(staffRole, isSuper === 1, resolvedPermissions);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();

      try {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has("logout") || urlParams.has("force")) {
          localStorage.removeItem("albayan_logged_user");
          localStorage.removeItem("albayan_saved_token");
          localStorage.removeItem("albayan_active_circle_id");
          sessionStorage.clear();
        }
      } catch (e) {}

      try {
        const savedRole = localStorage.getItem("albayan_last_staff_role") || "teacher";
        selectStaffRole(savedRole);
      } catch (e) {
        selectStaffRole("teacher");
      }

      try {
        const savedUser = localStorage.getItem("albayan_saved_username");
        if (savedUser) {
          const sInput = document.getElementById("staffUsernameInput");
          if (sInput && !sInput.value) sInput.value = savedUser;
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
