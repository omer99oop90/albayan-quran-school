<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="csrf-token" content="">
  <title>بوابة علامات الطالب - مدرسة البيان لتعليم القرآن</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark_theme.css?v=2.2">
  <link rel="stylesheet" href="mymark.css?v=3.5">
  
  <!-- Hijri Date Engine -->
  <script src="hijri_date.js"></script>
  <!-- Lucide Icons -->
  <script src="lucide.min.js"></script>
  <script>if(typeof lucide==='undefined'){document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');}</script>
</head>

<body class="mymark-body">

  <!-- Loading State Indicator (Hidden by default when cached data exists to prevent reload flicker) -->
  <div id="portalLoading" style="position:fixed; inset:0; background:rgba(15,23,42,0.45); backdrop-filter:blur(6px); z-index:99999; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff;">
    <div style="width:44px; height:44px; border:3.5px solid rgba(255,255,255,0.2); border-top-color:#2563eb; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <span style="font-size:15px; font-weight:700;">جاري تحميل بياناتك ونتائجك...</span>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>
  <script>
    if (!localStorage.getItem('albayan_student_portal_cache')) {
      var pl = document.getElementById('portalLoading');
      if (pl) pl.style.display = 'flex';
    }
  </script>

  <!-- Main Content Area -->
  <main class="portal-content" id="portalMainContent" style="padding-top:20px; padding-bottom:80px;">
    
    <!-- Hero Student Profile Card (بطاقة الطالب) -->
    <section class="student-hero-card" style="margin-bottom:16px;">
      <div class="hero-pattern"></div>
      
      <div class="hero-main">
        <div class="student-avatar" id="studentAvatarInitials">ط</div>
        <div class="hero-text">
          <h2>أهلاً بك، <span id="heroStudentName">الطالب</span></h2>
          <div class="hero-quran-quote">« خَيْرُكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ »</div>
        </div>
      </div>

      <div class="hero-badges-row">
        <span class="hero-badge">
          <i data-lucide="book-marked" style="width:13px; height:13px;"></i>
          <span id="heroCircleName">حلقة قرآنية</span>
        </span>
        <span class="hero-badge">
          <i data-lucide="user-check" style="width:13px; height:13px;"></i>
          <span id="heroTeacherName">المحفظ</span>
        </span>
        <div class="hero-rank-pill" id="heroRankPill">
          <i data-lucide="award" style="width:13px; height:13px;"></i>
          <span>المستوى المتقدم</span>
        </div>
      </div>
    </section>

    <!-- 2x2 KPI Metrics Grid -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon-wrap emerald">
          <i data-lucide="file-check-2" style="width:22px; height:22px;"></i>
        </div>
        <div class="stat-data">
          <div class="stat-label">إجمالي الاختبارات</div>
          <div class="stat-value" id="statTotalExams">0</div>
          <div class="stat-sub">اختبارات منجزة</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrap blue">
          <i data-lucide="pie-chart" style="width:22px; height:22px;"></i>
        </div>
        <div class="stat-data">
          <div class="stat-label">المعدل التراكمي</div>
          <div class="stat-value" id="statAvgScore">0%</div>
          <div class="stat-sub">متوسط الدرجات</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrap amber">
          <i data-lucide="trending-up" style="width:22px; height:22px;"></i>
        </div>
        <div class="stat-data">
          <div class="stat-label">نسبة الاجتياز</div>
          <div class="stat-value" id="statPassedRate">0%</div>
          <div class="stat-sub" id="statPassedSub">0 اختبارات مجتازة</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrap purple">
          <i data-lucide="check-check" style="width:22px; height:22px;"></i>
        </div>
        <div class="stat-data">
          <div class="stat-label">الأسئلة الصحيحة</div>
          <div class="stat-value" id="statTotalPoints">0 / 0</div>
          <div class="stat-sub">إجابات متقنة</div>
        </div>
      </div>
    </section>

    <!-- Filter & Search Bar with Clean Swipeable Chips -->
    <div class="exam-filter-bar">
      <div class="filter-search-box">
        <input type="text" placeholder="ابحث باسم الاختبار أو درجتك..." oninput="handleSearchExams(event)">
        <i data-lucide="search" class="search-icon" style="width:16px; height:16px;"></i>
      </div>

      <div class="filter-chips">
        <button type="button" class="filter-chip active" onclick="setExamFilter('all', this)">الكل</button>
        <button type="button" class="filter-chip" onclick="setExamFilter('excellent', this)">ممتاز</button>
        <button type="button" class="filter-chip" onclick="setExamFilter('verygood', this)">جيد جداً</button>
        <button type="button" class="filter-chip" onclick="setExamFilter('passed', this)">ناجح</button>
        <button type="button" class="filter-chip" onclick="setExamFilter('review', this)">يحتاج مراجعة</button>
      </div>
    </div>

    <!-- Exam Cards Feed -->
    <div class="exam-cards-list" id="examsListContainer">
      <!-- Rendered dynamically via mymark.js -->
    </div>

  </main>

  <!-- Answers Breakdown Bottom Sheet Modal -->
  <div id="answersBreakdownModal" class="portal-modal-overlay" onclick="if(event.target===this) closeAnswersModal()">
    <div class="portal-modal-card">
      <div class="sheet-drag-handle"></div>
      <div class="modal-header">
        <div>
          <h3 id="modalExamTitle">تفاصيل الإجابات</h3>
          <span class="percentage-badge grade-excellent" id="modalExamScoreBadge" style="margin-top:4px; font-size:12px; height:26px;"></span>
        </div>
        <button type="button" class="modal-close-btn" onclick="closeAnswersModal()" aria-label="إغلاق">
          <i data-lucide="x" style="width:18px; height:18px;"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="answers-breakdown-list" id="modalAnswersList">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="albayan_dialog.js?v=1.0"></script>
  <script src="student_common.js?v=1.0"></script>
  <script src="mymark.js?v=3.0"></script>
  <script src="student_nav.js?v=1.0"></script>
</body>
</html>
